# Ask the site to refresh the external schedules that have come due.
#
# This used to be the ten-minute tick, because a Vercel Hobby account may only
# run a cron once a day and the connector's live window is twenty minutes. The
# project is on Pro now, so vercel.json does it properly and this no longer
# runs on a schedule — two pollers would mean two requests to somebody else's
# server for every one we need.
#
# Kept for the hand-triggered case, which turned out to matter more than
# expected: it is how four backfilled tournaments were pulled in without
# waiting, and how you check a connector after changing it. Run it from the
# Actions tab.
#
# Worth knowing if the schedule ever comes back here: GitHub delays scheduled
# workflows under load, and we measured 110 minutes between consecutive ticks
# of a supposedly ten-minute cron.
name: sync

on:
  workflow_dispatch:

# One at a time. A slow run overlapping the next tick would double the
# requests we make to somebody else's server, which is the one thing a
# well-behaved crawler must not do.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh what is due
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is not set on this repository."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          # Separated so a network failure reads as 000 rather than as the
          # empty output of a command substitution that never ran.
          code=$(curl -sS -m 120 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://kingjuansoccer.com/api/cron/sync) || code=000

          cat response.json 2>/dev/null || true
          echo

          if [ "$code" != "200" ]; then
            echo "::error::/api/cron/sync answered $code"
            exit 1
          fi

          # A 200 that reports failures is still a problem worth seeing: a
          # connector whose platform changed its markup answers 200 here and
          # fails every event inside it.
          failed=$(python3 -c "import json;print(json.load(open('response.json')).get('failed',0))")
          if [ "$failed" != "0" ]; then
            echo "::warning::$failed event(s) failed to sync — see /admin/sync"
          fi
