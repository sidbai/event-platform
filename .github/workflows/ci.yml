name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first: it generates .next/types (LayoutProps etc.) and fails on type errors
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Everything the pure suite cannot see. A query can build, typecheck, lint
  # and pass every unit test, and still throw the moment a driver receives it —
  # that is how a Date in a raw sql`` fragment took down the home feed. This job
  # is the one that would have caught it.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: king_juan_soccer_test
        ports:
          - 5432:5432
        # Without this the job races the container and connects to nothing.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/king_juan_soccer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The migrations are part of what is under test: a broken one fails here
      # rather than against the production database.
      - name: Migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/king_juan_soccer_test
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          if ! pnpm db:migrate; then
            # drizzle-kit swallows the driver's message behind its spinner, so
            # replay the files against a clean database to find out what
            # actually broke. Diagnostic only; the job fails either way.
            echo "=== drizzle-kit failed; replaying with psql for a readable error ==="
            psql -h 127.0.0.1 -U postgres -c 'drop database if exists diag' postgres
            psql -h 127.0.0.1 -U postgres -c 'create database diag' postgres
            for f in drizzle/*.sql; do
              echo "--- $f"
              psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -f "$f" diag || exit 1
            done
            exit 1
          fi
      - run: pnpm test:db
